<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | SkillMate</title>
    <link rel="stylesheet" href="./StudentLogin.css">
</head>
<body>

    <header class="navbar">
        <a href="Login.html" class="logo">
            <span class="logo-icon">S</span>
            <span>Skill<span class="logo-orange">Mate</span></span>
        </a>

        <nav class="nav-links">
            <a href="Login.html#about">About</a>
            <a href="Login.html#features">Features</a>
            <a href="ProfileDetails.html" class="signup-link">Create Account</a>
        </nav>
    </header>

    <main class="page-container">
        <section class="login-card">

            <div class="brand-mark">S</div>

            <div class="eyebrow">
                <span class="orange-dot"></span>
                WELCOME BACK TO SKILLMATE
            </div>

            <h1>Welcome <span>back!</span></h1>
            <p class="subtitle">
                Sign in to discover your next skill match.
            </p>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">College Email ID</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@college.edu"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <div class="password-label">
                        <label for="password">Password</label>
                        <a href="#" id="forgotPassword">Forgot password?</a>
                    </div>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            id="togglePassword"
                            class="show-password"
                            aria-label="Show password"
                        >Show</button>
                    </div>
                </div>

                <label class="remember-row">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember my email on this device</span>
                </label>

                <p id="formMessage" class="form-message" role="status"></p>

                <button type="submit" class="login-button">
                    Sign In <span>→</span>
                </button>

            </form>

            <div class="divider">
                <span>NEW TO SKILLMATE?</span>
            </div>

            <a href="ProfileDetails.html" class="create-account-button">
                Create Your Account
            </a>

            <p class="footer-note">
                Made for students who love learning together.
                <span>✦</span>
            </p>

        </section>
    </main>

    <script src="./StudentLogin.js"></script>
</body>
</html>
