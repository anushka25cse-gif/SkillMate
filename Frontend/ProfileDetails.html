<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account | SkillMate</title>
   <link rel="stylesheet" href="./ProfileDetails.css">
</head>
<body>

    <header class="navbar">
        <a href="Login.html" class="logo">
            <span class="logo-icon">S</span>
            <span>SkillMate</span>
        </a>

        <nav class="nav-links">
            <a href="Login.html#about">About</a>
            <a href="Login.html#features">Features</a>
            <a href="StudentLogin.html" class="login-link">Student Login</a>
        </nav>
    </header>

    <main class="page-container">
        <section class="intro">
            <div class="intro-tag">
                <span class="tag-dot"></span>
                YOUR JOURNEY STARTS HERE
            </div>

            <h1>Create your <span>account.</span></h1>
            <p>Enter your college details to join SkillMate.</p>
        </section>

        <section class="form-card">
            <div class="card-heading">
                <div class="heading-icon">✦</div>
                <div>
                    <h2>Student Details</h2>
                    <p>Let's get to know you better.</p>
                </div>
            </div>

            <form id="signupForm" class="signup-form">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName">Full Name <span>*</span></label>
                        <input type="text" id="fullName" name="fullName"
                               placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">College Email ID <span>*</span></label>
                        <input type="email" id="email" name="email"
                               placeholder="you@college.edu" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="college">College / University <span>*</span></label>
                        <input type="text" id="college" name="college"
                               placeholder="Enter your college name" required>
                    </div>

                    <div class="form-group">
                        <label for="registration">Registration Number <span>*</span></label>
                        <input type="text" id="registration" name="registration"
                               placeholder="Enter your registration number" required>
                    </div>

                    <div class="form-group">
                        <label for="course">Course / Degree <span>*</span></label>
                        <select id="course" name="course" required>
                            <option value="" disabled selected>Select your course</option>
                            <option value="B.Tech">B.Tech</option>
                            <option value="B.E.">B.E.</option>
                            <option value="BCA">BCA</option>
                            <option value="B.Sc.">B.Sc.</option>
                            <option value="BBA">BBA</option>
                            <option value="BA">BA</option>
                            <option value="M.Tech">M.Tech</option>
                            <option value="MCA">MCA</option>
                            <option value="MBA">MBA</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="year">Current Year / Class <span>*</span></label>
                        <select id="year" name="year" required>
                            <option value="" disabled selected>Select your year</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                            <option value="5th Year">5th Year</option>
                            <option value="Postgraduate">Postgraduate</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="graduation">Graduation Batch <span>*</span></label>
                        <select id="graduation" name="graduation" required>
                            <option value="" disabled selected>Select your batch</option>
                            <option value="2026">2026</option>
                            <option value="2027">2027</option>
                            <option value="2028">2028</option>
                            <option value="2029">2029</option>
                            <option value="2030">2030</option>
                            <option value="2031">2031</option>
                            <option value="2032">2032</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="password">Create Password <span>*</span></label>
                        <input type="password" id="password" name="password"
                               placeholder="At least 8 characters"
                               minlength="8" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="confirmPassword">Confirm Password <span>*</span></label>
                        <input type="password" id="confirmPassword"
                               name="confirmPassword"
                               placeholder="Re-enter your password" required>
                    </div>
                </div>

                <label class="terms-row">
                    <input type="checkbox" id="terms" name="terms" required>
                    <span>I agree to the
                        <a href="#terms">Terms of Service</a> and
                        <a href="#privacy">Privacy Policy</a>.
                    </span>
                </label>

                <p id="formMessage" class="form-message" role="status"></p>

                <button type="submit" class="create-button">
                    Create My Account <span>→</span>
                </button>

                <p class="signin-text">
                    Already have an account?
                    <a href="StudentLogin.html">Sign in</a>
                </p>
            </form>
        </section>

        <footer class="page-footer">
            <span>Made for students who love learning together.</span>
            <span class="footer-star">✦</span>
        </footer>
    </main>

<script src="./ProfileDetails.js"></script>
</body>
</html>
