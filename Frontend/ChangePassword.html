<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | SkillMate</title>
    <link rel="stylesheet" href="./ChangePassword.css">
    <script src="./ChangePassword.js" defer></script>
</head>
<body>

    <main class="password-container">

        <a href="./Dashboard.html" class="back-link">← Back to Dashboard</a>

        <div class="password-card">

            <div class="lock-icon">🔒</div>

            <h1>Change Password</h1>

            <p class="subtitle">
                Keep your SkillMate account secure by updating your password.
            </p>

            <form id="changePasswordForm">

                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Enter your current password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter your new password"
                        minlength="8"
                        required
                    >
                    <small>Minimum 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your new password"
                        required
                    >
                </div>

                <p id="passwordMessage" role="status"></p>

                <button type="submit" id="changePasswordBtn">
                    Update Password
                </button>

            </form>

        </div>

    </main>

</body>
</html>
